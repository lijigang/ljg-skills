<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@500;700;900&display=swap');

  :root {
    --bg: #FAF8F4;
    --paper: #F5F1E8;
    --ink: #1F1F1F;
    --ink-strong: #111111;
    --ink-light: #6B6B6B;
    --red: #B85048;
    --blue-deep: #5979A6;
    --amber: #B8924A;
    --sans: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
    --serif: 'Noto Serif SC', 'Songti SC', serif;
    --hand: 'Caveat', '楷体', 'STKaiti', cursive;
    --mono: 'SF Mono', 'Menlo', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; background: var(--bg); }
  body { font-family: var(--sans); color: var(--ink); }

  .page { width: 1080px; background: var(--bg); position: relative; overflow: hidden; }

  .generated-visual,
  .generated-art { position: relative; overflow: hidden; }
  .generated-visual[data-state="empty"] { display: none; }

  .generated-visual--sketchnote {
    margin: 48px 60px 18px;
    aspect-ratio: 16 / 9;
    background: var(--paper);
  }

  .generated-visual img,
  .generated-art img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .generated-art figcaption {
    margin-top: 10px;
    padding-left: 12px;
    border-left: 2px solid var(--amber);
    font: italic 400 16px/1.45 var(--serif);
    color: var(--ink-light);
  }

  .generated-art--origin { aspect-ratio: 4 / 3; }
  .generated-art--failed { aspect-ratio: 16 / 9; }
  .generated-art--reversal { aspect-ratio: 4 / 3; }
  .generated-art--insight { aspect-ratio: 7 / 5; }
  .generated-art--named { aspect-ratio: 4 / 3; }

  .colophon {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 32px 60px 40px;
    margin-top: 30px;
    border-top: 1px solid rgba(17,17,17,0.10);
  }

  .colophon .who { display: flex; align-items: center; gap: 14px; }
  .colophon .who img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
  .colophon .who span { font: 400 22px/1 var(--sans); color: var(--ink-light); }
  .colophon .info-source { font: 400 20px/1 var(--mono); color: var(--ink-light); }

  {{CUSTOM_CSS}}
</style>
</head>
<body>
<div class="page">
  <figure class="generated-visual generated-visual--sketchnote" data-state="{{IMAGE_STATE}}">
    <img src="{{IMAGE_SRC}}" alt="{{IMAGE_ALT}}">
  </figure>
  {{CONTENT_HTML}}
  <div class="colophon">
    <div class="who">
      <img src="{{LOGO}}" alt="">
      <span>李继刚</span>
    </div>
    {{SOURCE_LINE}}
  </div>
</div>
</body>
</html>
