<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=DM+Sans:wght@400;500;700&display=swap');

  :root {
    --bg: #FAFAF7;
    --ink: #1A1A1A;
    --ink-mid: #55524F;
    --ink-light: #96918B;
    --tone: #E7E4DE;
    --serif: 'Noto Serif SC', 'KingHwa_OldSong', Georgia, serif;
    --sans: 'DM Sans', 'PingFang SC', system-ui, sans-serif;
    --mono: 'SF Mono', 'Menlo', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; background: var(--bg); }

  .page {
    width: 1080px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  .generated-visual,
  .generated-art {
    position: relative;
    overflow: hidden;
    background: var(--tone);
  }

  .generated-visual[data-state="empty"] { display: none; }

  .generated-visual--comic {
    margin: 42px 60px 26px;
    border: 4px solid var(--ink);
    aspect-ratio: 16 / 9;
  }

  .generated-visual img,
  .generated-art img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(1) contrast(1.08);
  }

  .generated-art--panel { min-height: 260px; }
  .panel-wide { aspect-ratio: 16 / 9; }
  .panel-square { aspect-ratio: 1; }
  .panel-portrait { aspect-ratio: 3 / 4; }

  .colophon {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 60px 36px;
    border-top: 3px solid var(--ink);
  }

  .colophon .who { display: flex; align-items: center; gap: 14px; }
  .colophon .who img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
  .colophon .who span { font: 400 24px/1 var(--sans); color: var(--ink-mid); }
  .colophon .info-source { font: 400 22px/1 var(--mono); color: var(--ink-light); }

  {{CUSTOM_CSS}}
</style>
</head>
<body>
<div class="page">
  <figure class="generated-visual generated-visual--comic" data-state="{{IMAGE_STATE}}">
    <img src="{{IMAGE_SRC}}" alt="{{IMAGE_ALT}}">
  </figure>
  {{CONTENT_HTML}}
  <div class="colophon">
    <div class="who">
      <img src="{{LOGO}}" alt="">
      <span>李继刚</span>
    </div>
    {{SOURCE_LINE}}
  </div>
</div>
</body>
</html>
