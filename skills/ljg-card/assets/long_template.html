<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: {{BG_COLOR}};
    --text: #292621;
    --text-mid: #746F68;
    --text-dim: #A39C92;
    --accent: {{ACCENT_COLOR}};
    --rule: #DED7CC;
    --panel: #F2ECE2;
    --font-display: 'PingFang SC', 'Noto Sans CJK SC', system-ui, sans-serif;
    --font-body: 'PingFang SC', 'Noto Sans CJK SC', system-ui, sans-serif;
    --font: var(--font-body);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    background: var(--bg);
  }

  .card {
    width: 1080px;
    background: var(--bg);
    padding: 68px 76px 54px;
    display: flex;
    flex-direction: column;
  }

  /* ── Title ── */
  .title-area {
    flex-shrink: 0;
    margin-bottom: 44px;
  }

  .title-area .eyebrow {
    font: 600 22px/1.4 var(--font-display);
    color: var(--accent);
    letter-spacing: 0.13em;
    margin-bottom: 18px;
  }

  .title-area h1 {
    max-width: 900px;
    font: 700 78px/1.12 var(--font-display);
    color: var(--text);
    letter-spacing: -0.035em;
    margin-bottom: 20px;
  }

  .title-area .deck {
    max-width: 820px;
    font: 400 31px/1.58 var(--font-body);
    color: var(--text-mid);
    letter-spacing: -0.01em;
    margin-bottom: 26px;
  }

  .title-area::after {
    content: '';
    display: block;
    width: 52px;
    height: 3px;
    background: var(--accent);
  }

  /* ── Content ── */
  .content {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  .content p {
    font: 400 34px/1.72 var(--font-body);
    color: var(--text);
    margin-bottom: 28px;
  }

  .content .highlight {
    font: 550 39px/1.55 var(--font-display);
    color: var(--text);
    padding: 14px 0 14px 26px;
    border-left: 3px solid var(--accent);
    margin: 36px 0;
  }

  .content .prompt {
    font: 500 36px/1.58 var(--font-body);
    color: var(--text);
    background: var(--panel);
    padding: 24px 30px 24px 36px;
    border-left: 4px solid var(--accent);
    margin: 32px 0;
    letter-spacing: -0.01em;
  }

  .content .prompt strong {
    color: var(--text);
  }

  .content h2 {
    font: 650 42px/1.38 var(--font-display);
    color: var(--text);
    margin: 44px 0 22px;
    letter-spacing: -0.02em;
  }

  .content h2:first-child {
    margin-top: 0;
  }

  .content .subtitle {
    font: 500 22px/2 var(--font-display);
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  .content .item {
    margin-bottom: 36px;
  }

  .content .item:last-child {
    margin-bottom: 0;
  }

  .content .item .label {
    font: 600 35px/1.5 var(--font-display);
    color: var(--text);
    margin-bottom: 6px;
  }

  .content .item p {
    font: 400 32px/1.68 var(--font-body);
    color: var(--text-mid);
    margin-bottom: 0;
  }

  .content blockquote {
    margin: 0 0 28px;
    padding-left: 26px;
    border-left: 3px solid var(--rule);
  }

  .content blockquote p {
    font: 400 34px/1.7 var(--font-body);
    color: var(--text-mid);
    margin-bottom: 6px;
  }

  .content strong {
    font-weight: 600;
    color: var(--text);
  }

  .content .divider {
    height: 1px;
    background: var(--rule);
    margin: 36px 0;
  }

  .content ul {
    list-style: none;
    margin-bottom: 28px;
  }

  .content ul li {
    font: 400 34px/1.7 var(--font-body);
    color: var(--text);
    padding: 4px 0 4px 28px;
    position: relative;
  }

  .content ul li::before {
    content: '·';
    position: absolute;
    left: 0;
    color: var(--text-mid);
  }

  /* ── Quiet narrative primitives ── */
  .narrative-beat {
    display: grid;
    grid-template-columns: 72px 1fr;
    gap: 24px;
    padding: 30px 0 26px;
    border-top: 1px solid var(--rule);
  }

  .narrative-beat:last-of-type {
    border-bottom: 1px solid var(--rule);
  }

  .beat-index {
    padding-top: 4px;
    font: 650 24px/1.4 'Menlo', 'SF Mono', monospace;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  .narrative-beat h2 {
    margin: 0 0 10px;
    font-size: 38px;
  }

  .narrative-beat p {
    margin-bottom: 0;
    color: var(--text-mid);
  }

  .metric-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 24px;
    margin: 38px 0;
  }

  .metric {
    min-height: 148px;
    padding: 22px 0 10px;
    border-top: 3px solid var(--accent);
  }

  .metric strong {
    display: block;
    font: 700 50px/1.12 var(--font-display);
    color: var(--text);
    letter-spacing: -0.04em;
    margin-bottom: 10px;
  }

  .metric span {
    display: block;
    font: 400 24px/1.55 var(--font-body);
    color: var(--text-mid);
  }

  .evidence-boundary {
    margin: 40px 0;
    padding: 30px 32px 26px;
    border: 1px solid var(--rule);
    background: var(--panel);
  }

  .evidence-boundary > strong:first-child {
    display: block;
    margin-bottom: 12px;
    font: 650 22px/1.4 var(--font-display);
    color: var(--accent);
    letter-spacing: 0.08em;
  }

  .evidence-boundary p {
    margin-bottom: 0;
    color: var(--text-mid);
  }

  .closing-judgment {
    margin: 48px 0 12px;
    padding-top: 30px;
    border-top: 4px solid var(--accent);
    font: 650 43px/1.48 var(--font-display);
    color: var(--text);
    letter-spacing: -0.025em;
  }

  /* ── Generated raster imagery ── */
  .generated-visual,
  .generated-art {
    margin: 0 0 42px;
  }

  .generated-visual[data-state="empty"] { display: none; }

  .generated-visual img,
  .generated-art img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 620px;
    object-fit: contain;
  }

  .generated-art--inline { margin: 30px 0 38px; }
  .generated-art--closing { margin: 38px 0 18px; }

  .generated-art figcaption {
    margin-top: 12px;
    font: 400 22px/1.5 var(--font-body);
    color: var(--text-dim);
  }

  /* ── Drop Cap ── */
  .content .dropcap::first-letter {
    font: 650 96px/0.86 var(--font-display);
    float: left;
    margin: 4px 16px 0 -4px;
    color: var(--text);
  }

  /* ── End Mark ── */
  .content::after {
    content: '●';
    display: block;
    text-align: right;
    font-size: 16px;
    color: var(--accent);
    opacity: 0.4;
    margin-top: 40px;
  }

  /* ── Footer ── */
  .footer {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 52px;
    padding-top: 22px;
    border-top: 1px solid var(--rule);
  }

  .footer .author {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .footer .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
  }

  .footer .author-name {
    font: 400 24px/1.5 var(--font-body);
    color: var(--text-mid);
    letter-spacing: 0.03em;
  }

  .footer .info-source {
    font: 400 22px/1.5 'Menlo', 'SF Mono', monospace;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="card">
    {{TITLE_BLOCK}}
    <figure class="generated-visual generated-visual--long" data-state="{{IMAGE_STATE}}">
      <img src="{{IMAGE_SRC}}" alt="{{IMAGE_ALT}}">
    </figure>
    <div class="content">
      {{BODY_HTML}}
    </div>
    <div class="footer">
      <div class="author">
        <img class="avatar" src="{{LOGO}}" alt="">
        <span class="author-name">李继刚</span>
      </div>
      {{SOURCE_LINE}}
    </div>
  </div>
</body>
</html>
